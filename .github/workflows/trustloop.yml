name: TrustLoop QA Gate
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Explicit test/staging URL (must be allowlisted)
        required: true
        type: string
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ inputs.target_url || vars.TRUSTLOOP_TARGET_URL }}
      TRUSTLOOP_ALLOWED_HOSTS: ${{ vars.TRUSTLOOP_ALLOWED_HOSTS }}
      TRUSTLOOP_ADAPTER: ${{ vars.TRUSTLOOP_ADAPTER || 'generic' }}
      TRUSTLOOP_ENVIRONMENT: ${{ vars.TRUSTLOOP_ENVIRONMENT }}
      TRUSTLOOP_TEST_ACCOUNT_LABEL: ${{ vars.TRUSTLOOP_TEST_ACCOUNT_LABEL }}
      TRUSTLOOP_OUT: reports/latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Run TrustLoop against explicit target
        if: env.TARGET_URL != ''
        run: pnpm test:site -- --url "$TARGET_URL" --out "$TRUSTLOOP_OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustloop-report-${{ github.run_id }}
          path: reports/latest/
          if-no-files-found: ignore
          retention-days: 30
