name: TrustLoop QA Gate
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Explicit test/staging URL (must be allowlisted)
        required: true
        type: string
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ inputs.target_url || vars.TRUSTLOOP_TARGET_URL }}
      TRUSTLOOP_ALLOWED_HOSTS: ${{ vars.TRUSTLOOP_ALLOWED_HOSTS }}
      TRUSTLOOP_ADAPTER: ${{ vars.TRUSTLOOP_ADAPTER || 'generic' }}
      TRUSTLOOP_ENVIRONMENT: ${{ vars.TRUSTLOOP_ENVIRONMENT }}
      TRUSTLOOP_TEST_ACCOUNT_LABEL: ${{ vars.TRUSTLOOP_TEST_ACCOUNT_LABEL }}
      # Stateful NianBox writes are disabled on push/PR. Enable only for a manual staging dispatch.
      TRUSTLOOP_NIANBOX_STATEFUL_TESTS: ${{ github.event_name == 'workflow_dispatch' && vars.TRUSTLOOP_NIANBOX_STATEFUL_TESTS || 'false' }}
      TRUSTLOOP_NIANBOX_STAGING_CONFIRMATION: ${{ secrets.TRUSTLOOP_NIANBOX_STAGING_CONFIRMATION }}
      TRUSTLOOP_NIANBOX_CLOUD_URL: ${{ vars.TRUSTLOOP_NIANBOX_CLOUD_URL }}
      TRUSTLOOP_NIANBOX_TEST_EMAIL: ${{ secrets.TRUSTLOOP_NIANBOX_TEST_EMAIL }}
      TRUSTLOOP_NIANBOX_TEST_PASSWORD: ${{ secrets.TRUSTLOOP_NIANBOX_TEST_PASSWORD }}
      TRUSTLOOP_NIANBOX_TEST_EMAIL_B: ${{ secrets.TRUSTLOOP_NIANBOX_TEST_EMAIL_B }}
      TRUSTLOOP_NIANBOX_TEST_PASSWORD_B: ${{ secrets.TRUSTLOOP_NIANBOX_TEST_PASSWORD_B }}
      TRUSTLOOP_OUT: reports/latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Run TrustLoop against explicit target
        if: env.TARGET_URL != ''
        run: pnpm test:site -- --url "$TARGET_URL" --out "$TRUSTLOOP_OUT"
      - name: Summarize verification scope
        if: always()
        shell: bash
        run: |
          {
            echo "## TrustLoop verification scope"
            echo ""
            printf '%s\n' '- Unit/type verification: see the `verify` step above.'
            if [ -n "$TARGET_URL" ]; then
              echo "- Target smoke test: attempted against the explicitly configured target."
              echo "- Target hostname: $(node -e 'try { console.log(new URL(process.env.TARGET_URL).hostname) } catch { console.log("invalid-or-unset") }')"
              echo "- Environment: ${TRUSTLOOP_ENVIRONMENT:-NOT_CONFIGURED}"
              echo "- Adapter: ${TRUSTLOOP_ADAPTER:-generic}"
            else
              echo "- Target smoke test: **NOT RUN**."
              printf '%s\n' '- Reason: no `workflow_dispatch` target URL or `TRUSTLOOP_TARGET_URL` repository variable was supplied.'
              echo "- This run must not be interpreted as end-to-end or security verification."
            fi
            echo "- Critical security checks remain blocked unless the report provides reproducible evidence."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trustloop-report-${{ github.run_id }}
          path: reports/latest/
          if-no-files-found: ignore
          retention-days: 30

  standard-app-template:
    name: Verify reusable standard app template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/standard-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install template dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck, unit tests, and production build
        run: pnpm verify
